name: deploy-production
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag, or branch to deploy'
        required: true
        default: 'main'
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix apps/studio-web --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:studio
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: DEPLOY_REF
          script: |
            set -euo pipefail
            cd /var/www/content-ai-platform
            git fetch --all --tags --prune
            # A branch name must resolve to the fetched remote branch; the server's local branch is never updated.
            if git rev-parse --verify --quiet "origin/$DEPLOY_REF^{commit}" >/dev/null; then
              git checkout --detach "origin/$DEPLOY_REF"
            else
              git checkout --detach "$DEPLOY_REF"
            fi
            echo "Deploying $(git rev-parse --short HEAD)"
            /var/www/content-ai-platform/scripts/deploy-production.sh
