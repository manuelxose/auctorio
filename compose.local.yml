services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auctorio
      POSTGRES_PASSWORD: auctorio
      POSTGRES_DB: content_ai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - auctorio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctorio -d content_ai"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  auctorio-postgres:
