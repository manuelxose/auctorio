openapi: 3.0.3
info:
  title: Content AI Platform API
  version: 1.0.0
  description: Public API for multi-tenant content generation (SEO and Instagram).
servers:
  - url: http://localhost:3000
security:
  - BearerAuth: []

paths:
  /v1/topics:
    post:
      tags: [topics]
      summary: Create a topic
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreateInput'
            examples:
              default:
                value:
                  title: "Turismo en Chipiona"
                  description: "Ideas para contenido SEO y social"
      responses:
        '201':
          description: Topic created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/topics/{id}/facts:
    post:
      tags: [facts]
      summary: Add facts to a topic (manual or scraping source)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactCreateInput'
            examples:
              manual:
                value:
                  source_type: manual
                  content: "Chipiona es conocida por su faro y playas"
              rss:
                value:
                  source_type: rss
                  source_ref: "https://example.com/feed"
      responses:
        '201':
          description: Fact stored (manual)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '202':
          description: Fact accepted or scrape job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/topics/{id}/generate-text:
    post:
      tags: [content-text]
      summary: Generate text for a topic
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTextInput'
            examples:
              seo_es:
                value:
                  type: seo
                  language: es
                  options:
                    tone: "informativo"
                    length: "long"
              ig_en:
                value:
                  type: instagram
                  language: en
                  options:
                    tone: "casual"
                    hashtags: true
      responses:
        '200':
          description: Content already exists (deduplicated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '202':
          description: Text job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/topics/{id}/generate-image:
    post:
      tags: [content-image]
      summary: Generate an independent image for a topic
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImageInput'
            examples:
              independent:
                value:
                  mode: independent
                  options:
                    style: "photorealistic"
                    size: "1024x1024"
      responses:
        '200':
          description: Content already exists (deduplicated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '202':
          description: Image job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/text/{id}/generate-image:
    post:
      tags: [content-image]
      summary: Generate a contextual image from a text content
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TextId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImageInput'
            examples:
              contextual:
                value:
                  mode: contextual
                  options:
                    style: "illustration"
                    size: "1024x1024"
      responses:
        '200':
          description: Content already exists (deduplicated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '202':
          description: Image job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/topics/{id}/results:
    get:
      tags: [topics]
      summary: Get all content for a topic
      parameters:
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: Topic results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResults'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/text/{id}:
    get:
      tags: [content-text]
      summary: Get generated text by id
      parameters:
        - $ref: '#/components/parameters/TextId'
      responses:
        '200':
          description: Content text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentText'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/images/{id}:
    get:
      tags: [content-image]
      summary: Get generated image by id
      parameters:
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Content image metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentImage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/session/me:
    get:
      tags: [studio]
      summary: Get tenant session summary for Studio clients
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/sites:
    get:
      tags: [studio]
      summary: List sites for the authenticated tenant
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated site summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSites'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [studio]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteInput'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSiteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/sites/{id}:
    get:
      tags: [studio]
      summary: Get site detail
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSiteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [studio]
      summary: Update a site
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteInput'
      responses:
        '200':
          description: Site updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSiteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v2/projects:
    get:
      tags: [studio]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, ai_generated, qa_failed, qa_passed, in_review, approved, publish_queued, published, publish_failed]
        - name: goal
          in: query
          schema:
            type: string
            enum: [article, landing, comparison, faq, newsletter, social_pack]
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [studio]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioProjectSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/projects/{id}:
    get:
      tags: [studio]
      summary: Get enriched project detail
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v2/projects/{id}/generate:
    post:
      tags: [studio]
      summary: Generate a new AI version for the project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type: string
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedGeneration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/projects/{id}/revise:
    post:
      tags: [studio]
      summary: Generate a revised version from manual feedback
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
      responses:
        '202':
          description: Revision queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedGeneration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/projects/{id}/approve:
    post:
      tags: [studio]
      summary: Approve the latest QA-passed version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Version approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/projects/{id}/publish:
    post:
      tags: [studio]
      summary: Queue publication, draft sync or unpublish for the latest version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationPayload'
      responses:
        '202':
          description: Publication queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedPublication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/publication-jobs:
    get:
      tags: [studio]
      summary: List website publication execution jobs (attempts)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, processing, draft_synced, published, failed, canceled]
      responses:
        '200':
          description: Paginated publication jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublications'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /studio/api/session/login:
    post:
      tags: [studio-bff]
      summary: Start a Studio SSR session from a tenant API key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
      responses:
        '200':
          description: Session started and cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /studio/api/session/logout:
    post:
      tags: [studio-bff]
      summary: Clear the Studio SSR session cookie
      security: []
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]

  /studio/api/session/me:
    get:
      tags: [studio-bff]
      summary: Read the current Studio SSR session
      security: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/sources:
    get:
      tags: [sources]
      summary: List content sources
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [rss, atom, html, sitemap, api, manual] } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Paginated sources }
    post:
      tags: [sources]
      summary: Create a content source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [rss, atom, html, sitemap, api, manual] }
                url: { type: string }
                siteId: { type: string, format: uuid }
                priority: { type: integer }
                trustScore: { type: number }
                refreshIntervalMinutes: { type: integer }
                categories: { type: array, items: { type: string } }
                configuration: { type: object }
      responses:
        '201': { description: Created source }
  /v2/sources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [sources]
      summary: Get a source
      responses: { '200': { description: Source } }
    patch:
      tags: [sources]
      summary: Update a source
      responses: { '200': { description: Updated source } }
    delete:
      tags: [sources]
      summary: Delete a source
      responses: { '200': { description: Deleted } }
  /v2/sources/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sources]
      summary: Test a source fetch
      responses: { '200': { description: Fetch result } }
  /v2/sources/{id}/fetch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sources]
      summary: Fetch a source now
      responses:
        '200':
          description: Fetch summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  fetched: { type: integer }
                  created: { type: integer }
                  duplicates: { type: integer }
                  failed: { type: boolean }
                  error: { type: string, nullable: true }

  /v2/source-items:
    get:
      tags: [inbox]
      summary: List discovered source items (wire/inbox)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: sourceId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: minScore, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [discovered, score] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses: { '200': { description: Paginated source items } }
  /v2/source-items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [inbox]
      summary: Get source item detail including cluster and projects
      responses: { '200': { description: Source item detail } }
  /v2/source-items/{id}/select:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbox]
      summary: Mark a source item as selected
      responses: { '200': { description: Updated item } }
  /v2/source-items/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbox]
      summary: Reject/ignore a source item
      responses: { '200': { description: Updated item } }
  /v2/source-items/{id}/create-project:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbox]
      summary: Rewrite a source item as a news article project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId]
              properties:
                siteId: { type: string, format: uuid }
                goal: { type: string, enum: [news_article, article] }
                allowUpdateExisting: { type: boolean }
      responses:
        '201': { description: Project created (or updated) }
        '409': { description: Story already covered }

  /v2/story-clusters:
    get:
      tags: [inbox]
      summary: List story clusters
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: Paginated clusters } }
  /v2/story-clusters/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [inbox]
      summary: Update cluster status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, selected, covered, rejected, archived] }
      responses: { '200': { description: Updated cluster } }

  /v2/publications:
    get:
      tags: [publications]
      summary: List durable publications with filters and pagination
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: channel, in: query, schema: { type: string, enum: [website, x, instagram] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ready, scheduled, queued, publishing, published, failed, canceled, deleted, unpublished] } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [scheduled, created, updated] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: failed, in: query, schema: { type: boolean } }
      responses: { '200': { description: Paginated publications } }
    post:
      tags: [publications]
      summary: Create a publication (article or social)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, channel]
              properties:
                projectId: { type: string, format: uuid }
                versionId: { type: string, format: uuid }
                channel: { type: string, enum: [website, x, instagram] }
                accountId: { type: string, format: uuid }
                siteId: { type: string, format: uuid }
                socialContentId: { type: string, format: uuid }
                scheduledFor: { type: string, format: date-time }
      responses: { '201': { description: Created publication } }
  /v2/publications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [publications]
      summary: Get publication with attempt history
      responses: { '200': { description: Publication detail } }
    patch:
      tags: [publications]
      summary: Update schedule or account
      responses: { '200': { description: Updated publication } }
    delete:
      tags: [publications]
      summary: Delete publication record
      responses: { '200': { description: Deleted publication } }
  /v2/publications/{id}/schedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Schedule publication
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { scheduledFor: { type: string, format: date-time } } }
      responses: { '200': { description: Scheduled } }
  /v2/publications/{id}/reschedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Reschedule publication
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { scheduledFor: { type: string, format: date-time } } }
      responses: { '200': { description: Rescheduled } }
  /v2/publications/{id}/publish-now:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Publish now
      responses: { '200': { description: Queued } }
  /v2/publications/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Cancel scheduled publication
      responses: { '200': { description: Canceled } }
  /v2/publications/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Retry failed publication
      responses: { '200': { description: Requeued } }
  /v2/publications/{id}/unpublish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [publications]
      summary: Unpublish/delete externally
      responses: { '200': { description: Queued } }

  /v2/calendar:
    get:
      tags: [calendar]
      summary: Calendar events (publications) in a date range
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: channel, in: query, schema: { type: string, enum: [website, x, instagram] } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Calendar events } }

  /v2/projects/{id}/social:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [social]
      summary: List social derivatives for a project
      responses: { '200': { description: Social content list } }
  /v2/projects/{id}/social/generate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [social]
      summary: Generate social derivatives (X/Instagram)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels: { type: array, items: { type: string, enum: [x, instagram] } }
                threadLength: { type: integer }
      responses: { '202': { description: Generation queued } }
  /v2/social/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [social]
      summary: Edit social content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                hashtags: { type: array, items: { type: string } }
                editorialStatus: { type: string, enum: [draft, approved, rejected] }
      responses: { '200': { description: Updated social content } }
  /v2/social/{id}/regenerate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [social]
      summary: Regenerate a social piece
      responses: { '202': { description: Queued } }

  /v2/publishing-accounts:
    get:
      tags: [accounts]
      summary: List publishing accounts (credentials never exposed)
      parameters:
        - { name: platform, in: query, schema: { type: string, enum: [website, x, instagram] } }
      responses: { '200': { description: Account list } }
    post:
      tags: [accounts]
      summary: Create a publishing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, displayName]
              properties:
                platform: { type: string, enum: [website, x, instagram] }
                displayName: { type: string }
                externalAccountId: { type: string }
                credentialsRef: { type: string, description: Environment variable name holding the credentials JSON }
      responses: { '201': { description: Created account } }
  /v2/publishing-accounts/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [accounts]
      summary: Verify platform credentials server-side
      responses: { '200': { description: Verification result } }

  /v2/automation:
    get:
      tags: [automation]
      summary: Get automation policy
      parameters: [ { name: siteId, in: query, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Policy } }
    patch:
      tags: [automation]
      summary: Update automation policy (volumes, windows, flags, limits)
      responses: { '200': { description: Updated policy } }
  /v2/automation/status:
    get:
      tags: [automation]
      summary: Automation operational status (today counts, next slots, warnings)
      parameters: [ { name: siteId, in: query, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Status } }
  /v2/automation/pause:
    post:
      tags: [automation]
      summary: Pause automation (kill switch)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string }, siteId: { type: string, format: uuid } } }
      responses: { '200': { description: Paused } }
  /v2/automation/resume:
    post:
      tags: [automation]
      summary: Resume automation
      responses: { '200': { description: Resumed } }

  /v2/overview:
    get:
      tags: [dashboard]
      summary: Operational dashboard data
      responses: { '200': { description: Overview } }
  /v2/audit:
    get:
      tags: [audit]
      summary: Audit log
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Audit entries } }
  /v2/health/workers:
    get:
      tags: [operations]
      summary: Worker queue health
      responses: { '200': { description: Queue counts } }

  /v2/campaigns:
    get:
      tags: [editorial]
      summary: List campaigns
      responses: { '200': { description: Campaigns } }
    post:
      tags: [editorial]
      summary: Create campaign
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string }, startAt: { type: string }, endAt: { type: string }, tags: { type: array, items: { type: string } } } }
      responses: { '201': { description: Created campaign } }
  /v2/briefs:
    get:
      tags: [editorial]
      summary: List editorial briefs
      responses: { '200': { description: Briefs } }
    post:
      tags: [editorial]
      summary: Create editorial brief
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                topic: { type: string }
                audience: { type: string }
                tone: { type: string }
                keywords: { type: array, items: { type: string } }
      responses: { '201': { description: Created brief } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    TopicId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TextId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TopicCreateInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    FactCreateInput:
      type: object
      required: [source_type]
      properties:
        source_type:
          type: string
          enum: [manual, rss, html, api]
        source_ref:
          type: string
        content:
          type: string
        metadata:
          type: object
      oneOf:
        - required: [content]
        - required: [source_ref]

    GenerateTextInput:
      type: object
      required: [type, language]
      properties:
        type:
          type: string
          enum: [seo, instagram]
        language:
          type: string
          enum: [es, en]
        options:
          type: object
          properties:
            tone:
              type: string
            length:
              type: string
              enum: [short, medium, long]
            hashtags:
              type: boolean

    GenerateImageInput:
      type: object
      properties:
        mode:
          type: string
          enum: [contextual, independent]
        options:
          type: object
          properties:
            style:
              type: string
            size:
              type: string
            seed:
              type: integer

    Topic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time

    Fact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [manual, rss, html, api]
        source_ref:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    ContentText:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [seo, instagram]
        language:
          type: string
          enum: [es, en]
        status:
          type: string
          enum: [queued, processing, done, failed, canceled]
        output:
          type: string
        created_at:
          type: string
          format: date-time

    ContentImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
        text_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, processing, done, failed, canceled]
        storage_path:
          type: string
        created_at:
          type: string
          format: date-time

    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, done, failed, canceled]

    ContentAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          nullable: true
        content_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, done, failed, canceled]

    TopicResults:
      type: object
      properties:
        topic_id:
          type: string
          format: uuid
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ContentText'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ContentImage'

    StudioSession:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            status:
              type: string
        siteCount:
          type: integer
        projectCount:
          type: integer

    JsonRecord:
      type: object
      additionalProperties: true
      nullable: true

    CreateSiteInput:
      type: object
      required: [key, name, type]
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [guiatv, tecnoria, webhook]
        locale:
          type: string
        baseUrl:
          type: string
          nullable: true
        brandVoice:
          $ref: '#/components/schemas/JsonRecord'
        seoRules:
          $ref: '#/components/schemas/JsonRecord'
        taxonomyMap:
          $ref: '#/components/schemas/JsonRecord'
        publishingCredentialsRef:
          type: string
          nullable: true

    UpdateSiteInput:
      allOf:
        - $ref: '#/components/schemas/CreateSiteInput'

    StudioSiteDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [guiatv, tecnoria, webhook]
        locale:
          type: string
        baseUrl:
          type: string
          nullable: true
        brandVoice:
          $ref: '#/components/schemas/JsonRecord'
        seoRules:
          $ref: '#/components/schemas/JsonRecord'
        taxonomyMap:
          $ref: '#/components/schemas/JsonRecord'
        publishingCredentialsRef:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationExecutionState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, draft_synced, published, failed, canceled]
        action:
          type: string
          enum: [publish, update, unpublish]
        targetStatus:
          type: string
          nullable: true
          enum: [draft, publish]
        externalId:
          type: string
          nullable: true
        externalUrl:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    VersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
        status:
          type: string
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true
        feedback:
          type: string
          nullable: true
        qaState:
          type: string
          enum: [not_ready, failed, passed, approved, published]
        hasAsset:
          type: boolean
        assetUrl:
          type: string
          nullable: true
        derivativeCount:
          type: integer
        latestPublicationJob:
          $ref: '#/components/schemas/PublicationExecutionState'
        qaReport:
          $ref: '#/components/schemas/JsonRecord'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudioSiteSummary:
      allOf:
        - $ref: '#/components/schemas/StudioSiteDetail'
        - type: object
          properties:
            projectCount:
              type: integer
            publishedProjectCount:
              type: integer
            latestPublicationJob:
              $ref: '#/components/schemas/PublicationExecutionState'

    CreateProjectInput:
      type: object
      required: [siteId, title, brief]
      properties:
        siteId:
          type: string
          format: uuid
        title:
          type: string
        brief:
          type: string
        goal:
          type: string
          enum: [article, landing, comparison, faq, newsletter, social_pack]
        primaryLanguage:
          type: string
        metadata:
          $ref: '#/components/schemas/JsonRecord'

    StudioProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        title:
          type: string
        brief:
          type: string
        goal:
          type: string
          enum: [article, landing, comparison, faq, newsletter, social_pack]
        status:
          type: string
          enum: [draft, ai_generated, qa_failed, qa_passed, in_review, approved, publish_queued, published, publish_failed]
        primaryLanguage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        site:
          type: object
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
            name:
              type: string
            type:
              type: string
              enum: [guiatv, tecnoria, webhook]
            locale:
              type: string
            baseUrl:
              type: string
              nullable: true
        latestVersion:
          $ref: '#/components/schemas/VersionSummary'
        latestPublicationJob:
          $ref: '#/components/schemas/PublicationExecutionState'

    StudioProjectDetail:
      allOf:
        - $ref: '#/components/schemas/StudioProjectSummary'
        - type: object
          properties:
            metadata:
              $ref: '#/components/schemas/JsonRecord'
            latestAssetUrl:
              type: string
              nullable: true
            site:
              $ref: '#/components/schemas/StudioSiteDetail'
            topic:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                  nullable: true
            latestVersion:
              $ref: '#/components/schemas/VersionSummary'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/VersionSummary'
            publicationJobs:
              type: array
              items:
                $ref: '#/components/schemas/PublicationExecutionState'

    PublicationPayload:
      type: object
      properties:
        action:
          type: string
          enum: [publish, update, unpublish]
        targetStatus:
          type: string
          enum: [draft, publish]

    QueuedGeneration:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        content_text_id:
          type: string
          format: uuid
          nullable: true
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]

    ApprovalResponse:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved]

    QueuedPublication:
      type: object
      properties:
        publication_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]

    PublicationListItem:
      allOf:
        - $ref: '#/components/schemas/PublicationExecutionState'
        - type: object
          properties:
            site:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                key:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum: [guiatv, tecnoria, webhook]
            project:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                status:
                  type: string
            version:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                versionNumber:
                  type: integer
                status:
                  type: string
            assetUrl:
              type: string
              nullable: true

    PaginatedSites:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudioSiteSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PaginatedProjects:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudioProjectSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PaginatedPublications:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationListItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [rss, atom, html, sitemap, api, manual] }
        url: { type: string, nullable: true }
        enabled: { type: boolean }
        priority: { type: integer }
        trustScore: { type: number }
        refreshIntervalMinutes: { type: integer }
        lastFetchedAt: { type: string, nullable: true }
        lastSuccessAt: { type: string, nullable: true }
        consecutiveFailures: { type: integer }
        discoveredCount: { type: integer }

    SourceItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        clusterId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        canonicalUrl: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        discoveredAt: { type: string }
        processingStatus: { type: string, enum: [discovered, fetched, parsed, duplicate, rejected, candidate, selected, processed, failed] }
        score: { type: number, nullable: true }
        scoreExplanation:
          type: array
          items:
            type: object
            properties:
              signal: { type: string }
              points: { type: number }
              detail: { type: string }
        source: { type: object, properties: { name: { type: string }, type: { type: string }, trustScore: { type: number } } }
        cluster: { type: object, nullable: true, properties: { id: { type: string }, headline: { type: string, nullable: true }, sourceCount: { type: integer } } }

    Publication:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        channel: { type: string, enum: [website, x, instagram] }
        status: { type: string, enum: [draft, ready, scheduled, queued, publishing, published, failed, canceled, deleted, unpublished] }
        scheduledFor: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        externalId: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        retryCount: { type: integer }
        lastError: { type: string, nullable: true }
        failureClass: { type: string, nullable: true }
        attempts:
          type: array
          items:
            type: object
            properties:
              attemptNumber: { type: integer }
              status: { type: string }
              error: { type: string, nullable: true }

    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        channel: { type: string, enum: [website, x, instagram] }
        status: { type: string }
        scheduledFor: { type: string, nullable: true }
        title: { type: string }
        destination: { type: string }
        automated: { type: boolean }

    SocialContent:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        channel: { type: string, enum: [x, instagram] }
        contentType: { type: string, enum: [x_post, x_thread, instagram_caption, instagram_story, social_post] }
        body: { type: string }
        hashtags: { type: array, items: { type: string } }
        characterCount: { type: integer, nullable: true }
        generationStatus: { type: string, enum: [queued, processing, done, failed] }
        editorialStatus: { type: string, enum: [draft, approved, rejected] }

    AutomationPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }
        state: { type: string, enum: [active, paused, degraded] }
        timezone: { type: string }
        articlesPerDay: { type: integer }
        maxArticlesPerDay: { type: integer }
        xPostsPerDay: { type: integer }
        instagramPostsPerDay: { type: integer }
        autoGenerate: { type: boolean }
        autoApprove: { type: boolean }
        autoSchedule: { type: boolean }
        autoPublish: { type: boolean }
        publishingWindows:
          type: array
          items:
            type: object
            properties:
              channel: { type: string }
              days: { type: array, items: { type: integer } }
              from: { type: string }
              to: { type: string }

    PublishingAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [website, x, instagram] }
        displayName: { type: string }
        externalAccountId: { type: string, nullable: true }
        enabled: { type: boolean }
        status: { type: string, enum: [pending, active, error, disabled] }
        hasCredentials: { type: boolean }

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
